version: "3.8"

services:
  php:
    image: php:8.4-fpm-alpine
    container_name: symfony-backend
    working_dir: /var/www/symfony
    volumes:
      - ./symfony-backend:/var/www/symfony
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: matice_symfony_front
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./symfony-backend:/var/www/symfony
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: symfony-backend_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: matices_symfony
      MYSQL_USER: symfony_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - symfony-backend_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: symfony-backend_adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    restart: unless-stopped
    depends_on:
      - mysql

volumes:
  symfony-backend_mysql_data:
